# HTTP -> HTTPS 리다이렉트 (두 도메인 공통)
server {
    listen 80;
    server_name i15d201.p.ssafy.io starttoo.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i15d201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15d201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d201.p.ssafy.io/privkey.pem;

    include /etc/nginx/proxy-locations.conf;
}

server {
    listen 443 ssl;
    server_name starttoo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/starttoo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starttoo.duckdns.org/privkey.pem;

    include /etc/nginx/proxy-locations.conf;
}
