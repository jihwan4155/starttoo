# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name i15d201.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i15d201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15d201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d201.p.ssafy.io/privkey.pem;

    client_max_body_size 100m;

    # backend API (context-path: /v1)
    location /v1/ {
        proxy_pass http://backend:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 서버 API. 실제 엔드포인트 프리픽스가 정해지면 맞춰서 수정한다.
    location /ai-service/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드 정적 파일 (SPA) - 항상 마지막에 매칭
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
