# HTTP -> HTTPS 리다이렉트 (세 도메인 공통)
server {
    listen 80;
    server_name i15d201.p.ssafy.io starttoo.duckdns.org starttoo-storage.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i15d201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15d201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d201.p.ssafy.io/privkey.pem;

    include /etc/nginx/proxy-locations.conf;
}

server {
    listen 443 ssl;
    server_name starttoo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/starttoo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starttoo.duckdns.org/privkey.pem;

    include /etc/nginx/proxy-locations.conf;
}

# MinIO 전용 공개 호스트. presigned URL의 Host 서명과 일치시키기 위해
# Host 헤더를 그대로 전달하고, 대용량 업로드를 위해 요청 버퍼링을 끈다.
# MinIO 콘솔(9001)은 여기서 프록시하지 않으므로 외부에서 접근할 수 없다.
server {
    listen 443 ssl;
    server_name starttoo-storage.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/starttoo-storage.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starttoo-storage.duckdns.org/privkey.pem;

    client_max_body_size 20m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
