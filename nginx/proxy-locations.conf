# 도커 내장 DNS. 컨테이너가 재생성(recreate)되어 내부 IP가 바뀌어도
# 매 요청마다 다시 조회하도록 강제하기 위해 proxy_pass를 변수로 받는다.
#
# 주의: proxy_pass에 변수를 쓰면 nginx가 "매칭된 location prefix를 대체하고
# 나머지 경로를 이어붙이는" 동작을 하지 않는다. 대신 변수 뒤에 경로를 안 적어야
# (URI 부분 없음) 원래 요청 경로가 그대로 전달된다. prefix를 벗겨내야 하는
# 곳(/ai-service/)은 rewrite로 미리 벗겨내고 나서 그 결과를 그대로 넘긴다.
resolver 127.0.0.11 valid=10s;

client_max_body_size 100m;

# Stable Diffusion generation can take a long time on CPU or while models load.
# Keep the proxy slightly above the one-hour application timeout.
location = /v1/tattoos/generate {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3660s;
    proxy_read_timeout 3660s;
}

# backend API (context-path: /v1)
location /v1/ {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Swagger UI / OpenAPI 문서. springdoc은 /v1 prefix 밖에서 자체 경로를 쓴다.
location ~ ^/(swagger-ui|v3/api-docs) {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# STOMP WebSocket. 장시간 연결이라 read timeout을 넉넉하게 잡는다.
location /ws {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Spring Boot Actuator. /v1 prefix 밖에서 자체 경로를 쓴다.
location /actuator/ {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# AI 서버 API. /ai-service/ prefix를 벗겨내고 나머지 경로를 그대로 전달한다.
#
# set 은 반드시 rewrite 보다 위에 있어야 한다. rewrite 의 break 는 "이 location 의
# rewrite 모듈 지시어 처리를 중단"이라는 뜻이고 set 도 rewrite 모듈 지시어라서,
# break 아래에 두면 실행되지 않는다. 그러면 $ai_upstream 이 빈 값이 되어
# proxy_pass http:// 가 되고 nginx 가 502 가 아니라 500 을 낸다.
location /ai-service/ {
    set $ai_upstream ai:8000;
    rewrite ^/ai-service/(.*)$ /$1 break;
    proxy_pass http://$ai_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 프론트엔드 정적 파일 (SPA) - 항상 마지막에 매칭
location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
