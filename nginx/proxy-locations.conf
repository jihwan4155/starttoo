# 도커 내장 DNS. 컨테이너가 재생성(recreate)되어 내부 IP가 바뀌어도
# 매 요청마다 다시 조회하도록 강제하기 위해 proxy_pass를 변수로 받는다.
resolver 127.0.0.11 valid=10s;

client_max_body_size 100m;

# backend API (context-path: /v1)
location /v1/ {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Swagger UI / OpenAPI 문서. springdoc은 /v1 prefix 밖에서 자체 경로를 쓴다.
location ~ ^/(swagger-ui|v3/api-docs) {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# STOMP WebSocket. 장시간 연결이라 read timeout을 넉넉하게 잡는다.
location /ws {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Spring Boot Actuator. /v1 prefix 밖에서 자체 경로를 쓴다.
location /actuator/ {
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream/actuator/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# AI 서버 API. 실제 엔드포인트 프리픽스가 정해지면 맞춰서 수정한다.
location /ai-service/ {
    set $ai_upstream ai:8000;
    proxy_pass http://$ai_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 프론트엔드 정적 파일 (SPA) - 항상 마지막에 매칭
location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
