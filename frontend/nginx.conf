server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 진입점은 캐시하되 매번 서버에 재검증시킨다.
    #
    # 이 헤더가 없으면 응답에 Cache-Control이 아예 없어서 브라우저가 Last-Modified
    # 기준 휴리스틱으로 index.html을 캐시한다. 그러면 배포한 뒤에도 옛 index.html에
    # 적힌 옛 번들 파일명을 계속 요청하고, 번들은 아래에서 7일 캐시되므로 화면이
    # 며칠씩 옛 코드에 머문다 (강제 새로고침해야 풀린다).
    #
    # no-cache는 "저장은 하되 쓸 때마다 확인"이라 ETag로 304가 돌아가고,
    # 바뀐 배포에서만 본문을 새로 받는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 번들 산출물은 파일명에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀐다.
    # (public/의 favicon.svg만 해시 없이 복사되므로 갱신이 최대 7일 늦을 수 있다)
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
