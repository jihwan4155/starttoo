spring:
  application:
    name: starttoo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/starttoo}
    username: ${DB_USERNAME:starttoo}
    password: ${DB_PASSWORD:starttoo-local-password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    issuer: starttoo
    secret: ${JWT_SECRET:local-development-secret-key-change-me-1234567890}
    access-token-ttl: 30m
    signup-token-ttl: 10m
    refresh-token-ttl: 30d
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:starttoo}
    secret-key: ${MINIO_SECRET_KEY:starttoo-local-secret}
    bucket: ${MINIO_BUCKET:starttoo}
    max-image-bytes: ${MAX_IMAGE_BYTES:15728640}
    upload-expiry: 10m
    download-expiry: 10m
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  sms:
    webhook-url: ${SMS_WEBHOOK_URL:}
    api-key: ${SMS_API_KEY:}
  firebase:
    # 변경: 로컬 기본값은 비활성화다. 운영에서는 서비스 계정 또는 ADC를 제공한다.
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    project-id: ${FIREBASE_PROJECT_ID:}
  ai:
    # false면 타투 판별·분석에 명시적 Stub을 사용한다.
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    tattoo-detection-path: /v1/tattoos/detect
    tattoo-analysis-path: /v1/tattoos/analyze
    generation-path: /v1/generations
    coverup-path: /v1/coverups
    simulation-path: /v1/simulations
  rate-limit:
    default-capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:60}
    default-window: ${RATE_LIMIT_DEFAULT_WINDOW:1m}
    mutation-capacity: ${RATE_LIMIT_MUTATION_CAPACITY:20}
    mutation-window: ${RATE_LIMIT_MUTATION_WINDOW:1m}
    phone-verification-request-capacity: ${RATE_LIMIT_PHONE_REQUEST_CAPACITY:5}
    phone-verification-request-window: ${RATE_LIMIT_PHONE_REQUEST_WINDOW:1m}
    phone-verification-confirm-capacity: ${RATE_LIMIT_PHONE_CONFIRM_CAPACITY:10}
    phone-verification-confirm-window: ${RATE_LIMIT_PHONE_CONFIRM_WINDOW:1m}
  search:
    log-flush-delay: ${SEARCH_LOG_FLUSH_DELAY:60000}
    count-snapshot-delay: ${SEARCH_COUNT_SNAPSHOT_DELAY:3600000}
    autocomplete-refresh-delay: ${SEARCH_AUTOCOMPLETE_REFRESH_DELAY:600000}
    reconciliation-cron: "${SEARCH_RECONCILIATION_CRON:0 0 4 * * *}"
  preference:
    survey: 5.0
    post-like: 2.0
    post-bookmark: 3.0
    collection: 4.0
    search-click: 0.5
    not-interested: -2.0
    dwell-short: 0.1
    dwell-medium: 0.5
    dwell-long: 1.0

logging:
  level:
    root: INFO
    com.starttoo.backend: INFO
