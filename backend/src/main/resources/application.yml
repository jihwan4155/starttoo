spring:
  application:
    name: starttoo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/starttoo}
    username: ${DB_USERNAME:starttoo}
    password: ${DB_PASSWORD:starttoo-local-password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    issuer: starttoo
    secret: ${JWT_SECRET:local-development-secret-key-change-me-1234567890}
    access-token-ttl: 30m
    signup-token-ttl: 10m
    refresh-token-ttl: 30d
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:starttoo}
    secret-key: ${MINIO_SECRET_KEY:starttoo-local-secret}
    bucket: ${MINIO_BUCKET:starttoo}
    max-image-bytes: ${MAX_IMAGE_BYTES:15728640}
    upload-expiry: 10m
    download-expiry: 10m
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  firebase:
    # 변경: 로컬 기본값은 비활성화다. 운영에서는 서비스 계정 또는 ADC를 제공한다.
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    project-id: ${FIREBASE_PROJECT_ID:}
  ai:
    # false면 타투 판별·분석에 명시적 Stub을 사용한다.
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    tattoo-detection-path: /v1/tattoos/detect
    tattoo-analysis-path: /v1/tattoos/analyze
    tattoo-batch-analysis-path: /v1/tattoos/analyze-batch
    generation-path: /api/v1/generate
    generation-timeout: ${AI_GENERATION_TIMEOUT:60m}
    coverup-path: /v1/coverups
    simulation-path: /v1/simulations
    # 배치 분석 타임아웃 = per-image × 이미지 수 + overhead. 최대 10장이면 460초다.
    # 비동기 워커 스레드에서 호출하므로 길어도 HTTP 응답 시간에는 영향이 없다.
    # 운영 서버는 GPU 가 없어 CPU 로 추론한다. 실측 장당 약 23초(4 vCPU, 유휴 상태)인데
    # 8개 컨테이너가 코어를 공유하므로 부하가 몰릴 때를 감안해 두 배로 잡는다.
    batch-timeout-per-image: ${AI_BATCH_TIMEOUT_PER_IMAGE:45s}
    batch-timeout-overhead: ${AI_BATCH_TIMEOUT_OVERHEAD:10s}
    classification-backfill-cron: ${AI_CLASSIFICATION_BACKFILL_CRON:0 */5 * * * *}
    classification-max-attempts: ${AI_CLASSIFICATION_MAX_ATTEMPTS:5}
    classification-backfill-batch-size: ${AI_CLASSIFICATION_BACKFILL_BATCH_SIZE:20}
    classification-retry-delay: ${AI_CLASSIFICATION_RETRY_DELAY:5m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  coverup:
    # false면 커버업 검색은 503, 색인 동기화는 건너뛴다. app.ai 와는 다른 서비스다.
    enabled: ${COVERUP_ENABLED:false}
    base-url: ${COVERUP_ENGINE_URL:http://localhost:8004}
    internal-token: ${COVERUP_INTERNAL_TOKEN:}
    search-timeout: 3s
    index-timeout: 30s
    engine-top-k: 24
    result-size: 16
    max-mask-base64-bytes: 102400
    presign-expiry: 1h
    circuit-failure-threshold: 5
    circuit-open-duration: 30s
    index-sync-batch-size: 50
    index-sync-cron: "${COVERUP_INDEX_SYNC_CRON:0 */10 * * * *}"
  rate-limit:
    default-capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:60}
    default-window: ${RATE_LIMIT_DEFAULT_WINDOW:1m}
    mutation-capacity: ${RATE_LIMIT_MUTATION_CAPACITY:20}
    mutation-window: ${RATE_LIMIT_MUTATION_WINDOW:1m}
    phone-availability-capacity: ${RATE_LIMIT_PHONE_AVAILABILITY_CAPACITY:5}
    phone-availability-window: ${RATE_LIMIT_PHONE_AVAILABILITY_WINDOW:1m}
    coverup-search-capacity: ${RATE_LIMIT_COVERUP_SEARCH_CAPACITY:30}
    coverup-search-window: ${RATE_LIMIT_COVERUP_SEARCH_WINDOW:1m}
  search:
    log-flush-delay: ${SEARCH_LOG_FLUSH_DELAY:60000}
    count-snapshot-delay: ${SEARCH_COUNT_SNAPSHOT_DELAY:3600000}
    autocomplete-refresh-delay: ${SEARCH_AUTOCOMPLETE_REFRESH_DELAY:600000}
    reconciliation-cron: "${SEARCH_RECONCILIATION_CRON:0 0 4 * * *}"
  preference:
    survey: 5.0
    post-like: 2.0
    post-bookmark: 3.0
    collection: 4.0
    not-interested: -2.0
    dwell-short: 0.1
    dwell-medium: 0.5
    dwell-long: 1.0

logging:
  level:
    root: INFO
    com.starttoo.backend: INFO
