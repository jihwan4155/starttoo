services:
  backend:
    build: ./backend
    container_name: starttoo-backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-key-must-be-changed-before-deployment}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-starttoo}
      DB_USERNAME: ${POSTGRES_USER:-starttoo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-starttoo-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-starttoo}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-starttoo-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-starttoo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-15728640}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-api:8000}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_GENERATION_TIMEOUT: ${AI_GENERATION_TIMEOUT:-10m}
      # 커버업 도안 검색 엔진. app.ai 와는 다른 서비스이고 같은 ai 컨테이너에 들어 있다.
      COVERUP_ENABLED: ${COVERUP_ENABLED:-false}
      COVERUP_ENGINE_URL: ${COVERUP_ENGINE_URL:-http://ai:8000}
      COVERUP_INTERNAL_TOKEN: ${COVERUP_INTERNAL_TOKEN:-}
      COVERUP_INDEX_SYNC_CRON: ${COVERUP_INDEX_SYNC_CRON:-0 */10 * * * *}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      # Vite는 빌드 시점에 값을 번들로 치환한다. 런타임 environment로는 주입되지 않으므로
      # env 파일의 VITE_KAKAO_JS_KEY를 반드시 build arg로 넘겨야 카카오 로그인이 동작한다.
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: starttoo-frontend
    restart: unless-stopped
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 커버업 도안 검색 엔진. 내부 전용이라 ports 를 열지 않는다 —
  # backend 가 starttoo-net 안에서 http://ai:8000 으로 호출한다.
  ai:
    image: ${COMPOSE_PROJECT_NAME:-s15p11d201}-ai:latest
    build: ./ai
    container_name: starttoo-ai
    restart: unless-stopped
    environment:
      COVERUP_STORE: /data/coverup_store
      # 리버스 프록시가 이 서비스를 공개로 열어 둘 수 있으므로(nginx 의 /ai-service/)
      # 토큰으로 막는다. backend 의 COVERUP_INTERNAL_TOKEN 과 같은 값이어야 한다.
      COVERUP_INTERNAL_TOKEN: ${COVERUP_INTERNAL_TOKEN:-}
      # 최초 대량 적재 CLI 가 도안 이미지를 받아올 때만 쓴다. 검색 경로는 MinIO 를
      # 건드리지 않는다(색인할 때 한 번 읽고 끝이다).
      #   docker compose exec ai python -m coverup.cli index --source minio --manifest ...
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-starttoo}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-starttoo-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-starttoo}
      # auto = 도안 3만 장 넘으면 1단계 후보 추림을 켠다. 그 아래는 전수 탐색이 더 정확·빠름
      COVERUP_STAGE1: ${COVERUP_STAGE1:-auto}
      # 검색은 CPU 바운드다. 무제한이면 코어를 다 먹는다.
      COVERUP_MAX_CONCURRENT: ${COVERUP_MAX_CONCURRENT:-3}
    volumes:
      # 특징 파일(도안당 18KB). 없으면 재시작마다 전체 재색인을 해야 한다.
      # 요청당 33MB 랜덤 읽기라 네트워크 스토리지에 두면 안 된다.
      - ai-store:/data/coverup_store
    networks:
      - starttoo-net
    healthcheck:
      # 200 이 아니라 ready 를 본다. 워밍업(인덱스 로드 + 더미 검색)이 끝나야 true 다.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health'))['ready'] else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai-api:
    image: ${COMPOSE_PROJECT_NAME:-s15p11d201}-ai:latest
    container_name: starttoo-ai-api
    restart: unless-stopped
    command: ["python", "-m", "api_server"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      APP_NAME: ${AI_APP_NAME:-Tattoo AI API}
      APP_ENV: ${AI_APP_ENV:-local}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: ${AI_APP_RELOAD:-false}
      APP_LOG_LEVEL: ${AI_APP_LOG_LEVEL:-info}
      API_PREFIX: ${AI_API_PREFIX:-/api/v1}
      CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      TATTOO_EXTRACTOR_ROOT: ${TATTOO_EXTRACTOR_ROOT:-/app/api_server/vendor/inklift_v11_7}
      TATTOO_GENERATOR_ROOT: ${TATTOO_GENERATOR_ROOT:-/app/api_server/vendor/tattoo_generator_sd15}
      TATTOO_CLASSIFIER_ROOT: ${TATTOO_CLASSIFIER_ROOT:-/app/api_server/vendor/tattoo_classifier_v3}
      MODEL_LOAD_ON_STARTUP: ${MODEL_LOAD_ON_STARTUP:-true}
      GENERATOR_LOAD_ON_STARTUP: ${GENERATOR_LOAD_ON_STARTUP:-true}
      CLASSIFIER_LOAD_ON_STARTUP: ${CLASSIFIER_LOAD_ON_STARTUP:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      # 추론 슬롯은 전역 1개다. 짧게 잡으면 동시 요청이 대기 없이 곧바로 503 이 되고,
      # 게시물 배치 분류가 항목별 실패로 흡수된다. 대기는 정상 상태로 본다.
      INFERENCE_WAIT_TIMEOUT_SECONDS: ${INFERENCE_WAIT_TIMEOUT_SECONDS:-120}
    volumes:
      # SigLIP2(model.safetensors 약 1.7GB)는 최초 기동 때 HuggingFace 에서 받아온다.
      # 볼륨 없이 두면 컨테이너 쓰기 레이어에 들어가서 배포마다(down/up) 다시 받아야 한다.
      - ai-siglip:/app/api_server/vendor/tattoo_classifier_v3/siglip2-so400m-patch16-384
      - ${SD15_MODEL_HOST_PATH:-./ai/api_server/vendor/tattoo_generator_sd15/models/stable-diffusion-v1-5}:/app/api_server/vendor/tattoo_generator_sd15/models/stable-diffusion-v1-5:ro
    networks:
      - starttoo-net
    healthcheck:
      # 서버가 응답하는지만 본다. 모델 로딩 실패(status=degraded)로 컨테이너를 unhealthy 로
      # 떨어뜨리면 nginx 가 ai-api 의 healthy 를 기다리다 사이트 전체가 안 뜬다.
      # 모델 상태는 /health 의 status·classifier_status 로 확인한다.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; json.load(urllib.request.urlopen('http://localhost:8000/health'))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis/redis-stack-server:latest
    container_name: starttoo-redis
    restart: unless-stopped
    # protected-mode가 켜져있으면 비밀번호 없이는 컨테이너 밖(backend 포함)에서 오는 연결을 다 거부한다.
    # redis는 외부에 포트를 노출하지 않아 내부 docker 네트워크에서만 접근 가능하므로 비활성화한다.
    # redis-stack-server 래퍼(모듈 로딩)를 그대로 쓰기 위해 redis-server가 아니라
    # redis-stack-server를 command로 지정하고 옵션만 얹는다.
    command: ["redis-stack-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "no"]
    volumes:
      - redis-data:/data
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli FT._LIST >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: starttoo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-starttoo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-starttoo-local-secret}
    volumes:
      - minio-data:/data
    networks:
      - starttoo-net
    # SSH 터널로만 접근하도록 loopback에만 바인딩한다. 0.0.0.0이 아니라
    # 127.0.0.1이라 호스트 밖에서는 이 포트로 직접 접근할 수 없다.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: ./nginx
    container_name: starttoo-nginx
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ai:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks:
      - starttoo-net

  postgres:
    image: postgres:16-alpine
    container_name: starttoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starttoo}
      POSTGRES_USER: ${POSTGRES_USER:-starttoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starttoo-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - starttoo-net
    # SSH 터널로만 접근하도록 loopback에만 바인딩한다. 0.0.0.0이 아니라
    # 127.0.0.1이라 호스트 밖에서는 이 포트로 직접 접근할 수 없다.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starttoo} -d ${POSTGRES_DB:-starttoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  starttoo-net:
    driver: bridge

volumes:
  redis-data:
  minio-data:
  postgres-data:
  # 커버업 검색 엔진의 특징 파일. 운영 서버에서는 노드 로컬 SSD 바인드 마운트를 권한다.
  ai-store:
  # 분류기의 subject 판별용 SigLIP2 가중치. 재빌드·재배포에도 남아야 한다.
  ai-siglip:
