services:
  backend:
    build: ./backend
    container_name: starttoo-backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-key-must-be-changed-before-deployment}
      # DB_URL / DB_USERNAME / DB_PASSWORD 등은 PostgreSQL 전환·ERD 확정 후 추가 예정
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # 개발 중 직접 접근용. 운영에서는 nginx만 외부 노출하고 이 매핑은 제거해도 된다.
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: starttoo-frontend
    restart: unless-stopped
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai:
    build: ./ai
    container_name: starttoo-ai
    restart: unless-stopped
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: starttoo-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - starttoo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: starttoo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-starttoo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required, set it in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - starttoo-net
    # 관리 UI, 개발 중에만 필요하면 유지
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: starttoo-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    # AWS 서버 UFW가 22/443/8989만 허용 -> 8989로 매핑. 443/TLS는 별도 작업에서 구성
    ports:
      - "8989:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - starttoo-net

  # DB(PostgreSQL 예정) 서비스는 ERD/드라이버 확정 후 추가한다.
  # backend가 mysql-connector-j를 쓰는 동안은 여기 연결해도 실제로는 동작하지 않는다.

networks:
  starttoo-net:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
